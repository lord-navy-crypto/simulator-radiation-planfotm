          while IFS= read -r line; do
            hash="${line%%  *}"
            rel="${line#*  }"
            mkdir -p "$(dirname "$rel")"
            cp "/tmp/source/$rel" "$rel"
          done < /tmp/manifest.txt

          python - <<'PY3'
          from pathlib import Path
          import hashlib
          root=Path('.')
          expected={}
          for line in Path('/tmp/manifest.txt').read_text().splitlines():
              h, rel=line.split('  ',1)
              expected[rel]=h
          actual=[]
          for p in root.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  rel=p.as_posix()
                  actual.append(rel)
                  got=hashlib.sha256(p.read_bytes()).hexdigest()
                  want=expected.get(rel)
                  if want is None:
                      raise SystemExit(f'Unexpected file: {rel}')
                  if got != want:
                      raise SystemExit(f'SHA mismatch: {rel} {got} != {want}')
          missing=sorted(set(expected)-set(actual))
          if missing:
              raise SystemExit(f'Missing files: {missing}')
          print(f'EXACT PACKAGE VERIFICATION PASSED: {len(actual)} files')
          PY3

