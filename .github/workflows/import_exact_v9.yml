name: Import exact V9 full visualization source

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify exact V9 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source /tmp/archive.tar.gz /tmp/manifest.txt
          mkdir -p /tmp/source
          curl -L --fail --retry 3 \
            "https://github.com/lord-navy-crypto/radia-magnet-studio/archive/b440e31a1291909a87d2d62363af1aeb7640c705.tar.gz" \
            -o /tmp/archive.tar.gz
          tar -xzf /tmp/archive.tar.gz -C /tmp/source --strip-components=1

          python - <<'PY2'
          from pathlib import Path
          import base64, gzip, hashlib
          src=Path('/tmp/source')
          jobs=[
              ([src/'.upload/reporting_full_results.py.gz.b64'], src/'reporting/full_results.py', '6ccfeb7e7f61da00ad5b5c7fc6acb8e4b23a082d518ee9292ac284a7b3141858'),
              ([src/'.upload/undulator_v11_radia_gui_v9.py.gz.b64'], src/'undulator_v11_radia_gui_v9.py', 'e30183cc4b402676142f714ac3f9ae86e89fd23b366e46af1376a38cd1ca5fdb'),
              ([src/f'.upload/integrated.part{i:02d}' for i in range(1,6)], src/'undulator_v11_radia_integrated_v9.py', 'bafe77b8df453963e2ea0798f79e6d00375d00496b4ebf5f34fb740b1576c987'),
          ]
          for pieces,dest,expected in jobs:
              encoded=''.join(p.read_text(encoding='utf-8') for p in pieces)
              data=gzip.decompress(base64.b64decode(encoded))
              got=hashlib.sha256(data).hexdigest()
              if got != expected:
                  raise SystemExit(f'SHA mismatch for {dest}: {got} != {expected}')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f'RECONSTRUCTED {dest.relative_to(src)} {got}')
          PY2

          cat > /tmp/manifest.txt <<'MANIFEST'
