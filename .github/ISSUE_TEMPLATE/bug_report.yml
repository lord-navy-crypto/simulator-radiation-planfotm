name: Bug report
description: Report a reproducible software/runtime problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include minimal parameters and commands.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, RADIA build/path, dependency versions.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      render: shell
